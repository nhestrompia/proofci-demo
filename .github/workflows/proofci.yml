name: ProofCI
on:
  pull_request_target:          # the workflow and policy come from the base branch
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read           # only to read approvals of policy changes
jobs:
  proofci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: nhestrompia/proofci@08bc1f8cd173cc0c37f69a80cfaa21e80e525d9c
        with:
          path: .
